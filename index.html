
<style>
:root{
  --green:#23694f;
  --green-dark:#174b39;
  --green-soft:#e5f1e9;
  --cream:#f7f6f0;
  --white:#ffffff;
  --text:#25352d;
  --muted:#78847b;
  --border:#e3e8e0;
  --orange:#e7a64b;
  --red:#b64d43;
  --shadow:0 5px 18px rgba(33,64,46,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--cream);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.5;
}
header{
  background:linear-gradient(135deg,var(--green-dark),var(--green));
  color:white;
  padding:28px 20px 30px;
  border-radius:0 0 26px 26px;
  box-shadow:0 8px 24px rgba(23,75,57,.15);
}
header h1{
  margin:0 0 5px;
  font-size:29px;
  font-weight:800;
  letter-spacing:-.8px;
}
header p{margin:0;color:#e1eee5;font-size:14px}
main{max-width:1000px;margin:auto;padding:14px}
nav{
  display:flex;
  gap:8px;
  padding:12px 0 18px;
  overflow-x:auto;
  scrollbar-width:none;
  position:sticky;
  top:0;
  z-index:5;
  background:var(--cream);
}
nav::-webkit-scrollbar{display:none}
button{
  appearance:none;
  border:0;
  border-radius:12px;
  padding:12px 15px;
  background:var(--green);
  color:white;
  font:inherit;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:transform .15s,background .15s;
}
button:active{transform:scale(.97)}
button:hover{background:var(--green-dark)}
nav button{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:white;
  color:#65736a;
  box-shadow:0 2px 6px rgba(0,0,0,.025);
}
nav button:not(.secondary){
  background:var(--green);
  color:white;
  border-color:var(--green);
}
button.secondary{
  background:var(--green-soft);
  color:var(--green-dark);
}
button.secondary:hover{background:#d5e8da}
button.danger{background:var(--red);color:white}
button.small{padding:8px 11px;font-size:12px}
.panel{display:none}
.panel.active{display:block;animation:appear .22s ease}
@keyframes appear{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}
.card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:19px;
  padding:19px;
  margin-bottom:15px;
  box-shadow:var(--shadow);
}
h2{
  font-size:21px;
  line-height:1.25;
  letter-spacing:-.4px;
  margin:0 0 16px;
  font-weight:800;
}
h3{font-size:17px;line-height:1.35;margin:0 0 8px}
p{margin:8px 0}
label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:11px 0 6px;
  color:#46564b;
}
input,select,textarea{
  display:block;
  width:100%;
  min-height:44px;
  border:1px solid #dce4dc;
  border-radius:11px;
  padding:11px 12px;
  font:inherit;
  font-size:14px;
  color:var(--text);
  background:#fff;
  outline:none;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(35,105,79,.10);
}
input[type=checkbox]{
  width:19px;
  min-width:19px;
  height:19px;
  min-height:19px;
  accent-color:var(--green);
  margin:0;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;
}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row>*{min-width:0}
.row h2{margin-bottom:0}
.muted{color:var(--muted);font-size:13px}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:var(--green-soft);
  color:var(--green-dark);
  border-radius:30px;
  padding:6px 10px;
  font-size:12px;
  font-weight:700;
}
.day{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  margin:12px 0;
  overflow:hidden;
  box-shadow:0 3px 10px rgba(33,64,46,.035);
}
.daytitle{
  padding:13px 15px;
  background:var(--green-soft);
  color:var(--green-dark);
  font-size:16px;
  font-weight:800;
}
.meal{padding:14px 15px;border-top:1px solid var(--border)}
.meal select{margin-top:9px}
.meal p{line-height:1.5}
.checkline{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14px;
  font-weight:600;
  line-height:1.45;
}
.total{
  font-size:26px;
  font-weight:850;
  letter-spacing:-.7px;
  color:var(--green);
  padding:6px 0;
}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.actions button{flex:1 1 auto}
.recipe{
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  margin:10px 0;
  background:#fff;
  transition:box-shadow .15s,border-color .15s;
}
.recipe:hover{
  border-color:#c8dbcd;
  box-shadow:0 5px 16px rgba(33,64,46,.06);
}
.recipe p{margin:8px 0}
details{margin-top:10px}
summary{
  cursor:pointer;
  color:var(--green);
  font-size:14px;
  font-weight:700;
  padding:5px 0;
}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  margin-top:10px;
  font-size:14px;
}
th,td{
  text-align:left;
  border-bottom:1px solid var(--border);
  padding:11px 7px;
  vertical-align:middle;
}
th{
  background:#f2f6f1;
  color:#56675a;
  font-size:12px;
  font-weight:800;
}
td input{padding:7px;min-width:55px}
td .checkline{font-size:13px}
tr:last-child td{border-bottom:0}
#budgetMessage{
  padding:10px 12px;
  border-radius:10px;
  background:var(--green-soft);
  color:var(--green-dark);
  font-weight:700;
  font-size:13px;
}
footer{padding:24px 10px;color:var(--muted);text-align:center;font-size:12px}
hr{border-color:var(--border)!important}
@media(max-width:600px){
  header{padding:23px 17px 25px;border-radius:0 0 22px 22px}
  header h1{font-size:26px}
  main{padding:10px}
  nav{margin:0 -2px;padding:10px 0 14px;gap:7px}
  nav button{padding:10px 12px;font-size:13px}
  .card{padding:15px;border-radius:16px}
  h2{font-size:19px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .row{gap:8px}
  .day{border-radius:14px}
  .meal{padding:12px}
  .actions button{flex:1 1 100%}
  #shoppingList{overflow-x:auto}
  table{min-width:430px}
  td,th{padding:10px 6px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
